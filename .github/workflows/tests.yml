name: Test source on Windows Linux and macOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q plugin scripts
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: source-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
          retention-days: 7
